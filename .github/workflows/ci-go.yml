name: CI (Go)

on:
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Unit tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Dependencies
        run: go mod download

      - name: Unit tests
        run: make test-unit

      - name: Build and static checks
        run: |
          go build -o "$RUNNER_TEMP/nordik-drive-api" ./cmd/server
          go build -o "$RUNNER_TEMP/nordik-gateway" ./cmd/gateway
          go build -o "$RUNNER_TEMP/nordik-worker" ./cmd/worker
          go build -o "$RUNNER_TEMP/nordik-notifications" ./cmd/notifications
          go build -o "$RUNNER_TEMP/nordik-identity" ./cmd/identity
          go build -o "$RUNNER_TEMP/nordik-audit" ./cmd/audit
          go vet ./...

      - name: Reproducible Identity RPC contract
        run: bash scripts/check-identity-contract.sh

      - name: Race checks for concurrent platform boundaries
        run: go test -race ./internal/gateway ./internal/circuit ./internal/jobs ./internal/database ./internal/requestscope ./internal/mailer ./internal/workload ./internal/observability ./internal/chat ./internal/auth ./internal/notifications ./internal/notificationcontract ./internal/outbox ./internal/identity ./internal/identityapp ./internal/identityclient ./internal/activity ./internal/audit ./internal/auditapp ./internal/auditoutbox ./internal/audittransport ./internal/supportschedule ./internal/workerapp ./cmd/identity ./cmd/audit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage.unit.out

  integration:
    name: Integration tests (Go)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nordik_baseline_test
          POSTGRES_USER: nordik_test
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nordik_test -d nordik_baseline_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://nordik_test:synthetic-test-only@127.0.0.1:55432/nordik_baseline_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Dependencies
        run: go mod download

      - name: Integration tests
        run: make test-integration

      - name: Real Envoy routing, uploads and failure handling
        run: go test -tags=integration,envoyintegration ./tests/integration -run '^TestEnvoyServiceRoutingAndStreaming$' -count=1

      - name: Coverage summary
        run: go tool cover -func=coverage.integration.out

      - name: New platform core coverage
        run: python3 scripts/check-platform-coverage.py coverage.integration.out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-coverage
          path: coverage.integration.out

  terraform:
    name: Terraform validation and mock safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory artifact credential redaction
        run: python3 -m unittest discover -s scripts -p 'test_milestone2_*.py'
      - name: Independent service release selection
        run: python3 -m unittest discover -s scripts -p 'test_changed_services.py'
      - name: Serialized runtime deployment and interrupted recovery
        run: python3 -m unittest discover -s scripts -p 'test_runtime_*.py'
      - name: Runtime Terraform plan scope
        run: python3 -m unittest discover -s scripts -p 'test_check_runtime_plan.py'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      - run: terraform test -filter=tests/safety.tftest.hcl
        working-directory: infra/terraform
      - run: terraform test -filter=tests/small_database.tftest.hcl -var-file=tests/fixtures/small-db.tfvars.example
        working-directory: infra/terraform
      - run: terraform test -filter=tests/rollout.tftest.hcl
        working-directory: infra/terraform
      - run: terraform test -filter=tests/notifications.tftest.hcl
        working-directory: infra/terraform
      - run: terraform test -filter=tests/identity_audit.tftest.hcl
        working-directory: infra/terraform
