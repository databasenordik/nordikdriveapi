name: Release changed development services
on:
  push:
    branches: [master]
permissions:
  contents: read
  id-token: write
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      any_changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: changes
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 scripts/changed_services.py --base "$BASE" --head "$HEAD"
  release:
    needs: changes
    if: needs.changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/service-release.yml
    with:
      service: ${{ matrix.id }}
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      target: ${{ matrix.target }}
