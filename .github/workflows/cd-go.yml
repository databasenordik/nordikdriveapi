name: CD (Go) Build + Push + Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: planar-ray-472112-e8
      REGION: us-west1
      CLOUD_RUN_SERVICE: nordikdriveapi
      AR_REPO: nordikdriveapi
      IMAGE_NAME: nordik_drive_go
      REGISTRY: us-west1-docker.pkg.dev

    steps:
      - uses: actions/checkout@v4

      # OIDC → short-lived creds (no keys)
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          # These are resource identifiers, not credentials. Keeping them explicit
          # prevents a stale GitHub secret from selecting a different pool or account.
          workload_identity_provider: projects/724838782318/locations/global/workloadIdentityPools/github-pool-api/providers/github-provider-api
          service_account: github-nordik-drive-deployer@planar-ray-472112-e8.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Compute image tag
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_URI=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build --no-cache -t "$IMAGE_URI" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_URI }}
          project_id: ${{ env.PROJECT_ID }}
