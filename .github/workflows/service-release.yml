name: Build and deploy one changed service
on:
  workflow_call:
    inputs:
      service: {type: string, required: true}
      dockerfile: {type: string, required: true}
      image: {type: string, required: true}
      target: {type: string, required: true}
permissions:
  contents: read
  id-token: write
concurrency:
  group: service-release-${{ inputs.service }}
  queue: max
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    env:
      IMAGE: us-west1-docker.pkg.dev/planar-ray-472112-e8/nordikdriveapi/${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/724838782318/locations/global/workloadIdentityPools/github-pool-api/providers/github-provider-api
          service_account: github-nordik-drive-deployer@planar-ray-472112-e8.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@v3
        with:
          registry: us-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - id: reference
        name: Record immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > "$RUNNER_TEMP/runtime-image-manifest.json"
          RUNTIME_IMAGE=$(python3 scripts/runtime_image_reference.py --image "$IMAGE" --digest "$DIGEST" --manifest "$RUNNER_TEMP/runtime-image-manifest.json")
          echo "image=$RUNTIME_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Published artifact: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Linux amd64 runtime: $RUNTIME_IMAGE" >> "$GITHUB_STEP_SUMMARY"
  stage:
    needs: build
    uses: ./.github/workflows/deploy-runtime.yml
    with:
      target: ${{ inputs.target }}
      image: ${{ needs.build.outputs.image }}
